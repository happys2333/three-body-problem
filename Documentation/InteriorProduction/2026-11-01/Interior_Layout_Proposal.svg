<path d="M669,122 V839" stroke="#33484e"/>
<text x="710" y="148" class="note">① 御座是视觉中心</text>
<text x="710" y="180" class="sub">石木与青铜组合；兽皮坐垫。</text>
<text x="710" y="205" class="sub">坐姿、手臂与脚部需要重新贴合。</text>
<text x="710" y="277" class="note">② 背景、柱面与墙边</text>
<text x="710" y="309" class="sub">先做一块兽面雷纹板，成对布置。</text>
<text x="710" y="334" class="sub">墙角补磨损、烟熏和少量重复纹带。</text>
<text x="710" y="406" class="note">③ 剧情演示地面</text>
<text x="710" y="438" class="sub">阴阳鱼与六十四卦采用程序几何。</text>
<text x="710" y="463" class="sub">保持平整，不添加阻挡玩家的碰撞。</text>
<text x="710" y="535" class="note">④ 计时与献历陈设</text>
<text x="710" y="567" class="sub">五层木箱沙漏自建；甲骨、历箱复用。</text>
<text x="710" y="592" class="sub">普通玻璃沙漏保留为配景候选。</text>
<text x="710" y="664" class="note">⑤ 火光和空间层次</text>
<text x="710" y="696" class="sub">四处精细火盆复用现有灯光预算。</text>
<text x="710" y="721" class="sub">天窗开启后出现日光落点与少量浮尘。</text>
<text x="710" y="800" class="small">图中尺寸来自项目：约 28 × 38 米，净高 8.4 米。</text>
<text x="710" y="827" class="small">金色：陈设重点   青色：演示区域   绿色：通行空间</text>
<text x="48" y="910" class="sub">制作顺序：御座与背景 → 五层沙漏 / 卦象 → 礼器火光 → 边缘陈设。</text>
</svg>