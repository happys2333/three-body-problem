name: Windows playtest service
on:
  push:
    paths:
      - 'Tools/dialogue_gateway.py'
      - 'Tools/llm_connection.py'
      - 'Tools/windows_voice.*'
      - 'Tools/test_playtest_access.py'
      - '.github/workflows/windows-playtest-check.yml'
  workflow_dispatch:
jobs:
  service:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: Tools
      - name: Check the shipped Python runtime, required AI access and Windows speech
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'traveller-python.zip'
          $service = Join-Path $env:RUNNER_TEMP 'TravellerAI'
          $runtime = Join-Path $service 'runtime'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embed-amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9e35319bffedab8b36ad44d8f377cb4f1733bcec257a0b6d04d94f01486ddb38') { throw 'Python checksum mismatch' }
          New-Item -ItemType Directory -Path $service -Force | Out-Null
          Copy-Item Tools (Join-Path $service 'Tools') -Recurse
          Expand-Archive $archive $runtime
          Add-Content (Join-Path $runtime 'python313._pth') '../Tools' -Encoding ascii
          & (Join-Path $runtime 'python.exe') -m unittest discover -s (Join-Path $service 'Tools') -p test_playtest_access.py -v
